[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aigo-cli"
version = "1.1.0"
description = "AIgo 平台官方命令行工具 - AI对话/联网问答/AI出图/网页解析/余额查询"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "AIgo" }]
keywords = ["aigo", "ai", "cli", "chat", "image", "qwen", "openai-compatible"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
aigo = "aigo_cli.main:main"
qt = "aigo_cli.main:main"

[tool.setuptools.packages.find]
include = ["aigo_cli*"]
